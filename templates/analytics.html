{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}

<div class="analytics-page">
    <section class="coming-soon">
        <div class="cs-blob cs-blob-top" aria-hidden="true"></div>
        <div class="cs-blob cs-blob-bottom" aria-hidden="true"></div>
        <div class="cs-dot cs-dot-solid" aria-hidden="true"></div>
        <div class="cs-dot cs-dot-ring" aria-hidden="true"></div>

        <article class="cs-card">
            <div class="cs-corner cs-corner-tr" aria-hidden="true"></div>
            <div class="cs-corner cs-corner-bl" aria-hidden="true"></div>

            <div class="cs-icon-wrap">
                <div class="cs-icon-glow" aria-hidden="true"></div>
                <div class="cs-icon">
                    <svg aria-hidden="true" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="12" r="8.5" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.8v4.6l3 1.8" />
                    </svg>
                </div>
            </div>

            <div class="cs-badge"><span>Coming Soon</span></div>

            <h1 class="cs-title">Advanced Analytics</h1>
            <p class="cs-description">We're working on powerful insights and visualizations to help you understand your spending patterns better.</p>

            <div class="cs-progress" role="img" aria-label="Feature in progress">
                <span class="cs-progress-dot" style="animation-delay: 0ms"></span>
                <span class="cs-progress-dot" style="animation-delay: 180ms"></span>
                <span class="cs-progress-dot" style="animation-delay: 360ms"></span>
            </div>
            <p class="cs-tagline">We're crafting something special</p>
            <p class="cs-brand">Spendly</p>

            <div class="cs-bar" aria-hidden="true"></div>
        </article>
    </section>
</div>

{% endblock %}
